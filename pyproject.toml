[project]
name = "kg-milp-diet"
version = "0.1.0"
description = "Knowledge-graph-to-MILP compiler for personalized diet planning (research prototype)"
authors = [
    {name = "akash"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pulp>=2.8,<4.0",
    "highspy>=1.7",
]

[project.optional-dependencies]
llm = ["anthropic"]

[project.scripts]
kgdiet = "kgdiet.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "kgdiet", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
